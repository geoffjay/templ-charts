name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint (go vet + gofmt)
        run: make lint

      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Compute total coverage
        id: coverage
        run: |
          pct=$(go tool cover -func=coverage.out | awk 'END {print $3}')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "Total coverage: $pct" >> "$GITHUB_STEP_SUMMARY"
          echo "Total coverage: $pct"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pct = '${{ steps.coverage.outputs.pct }}';
            const marker = '<!-- coverage-report -->';
            const sha = context.sha.substring(0, 7);
            const body = [
              marker,
              '### Test coverage',
              '',
              `**${pct}** of statements covered.`,
              '',
              `<sub>Updated for ${sha}.</sub>`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
